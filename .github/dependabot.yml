version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/typescript"
    # Check the npm registry for updates every day (weekdays)
    schedule:
      interval: "daily"
    commit-message:
      prefix: fix
      prefix-development: chore
    # Create a group of dependencies to be updated together in one pull request:
    # https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
    groups:
      # Group name is used in pull request titles and branch names
      nx:
        applies-to: version-updates # Applies the group rule to version updates
        patterns: # Define patterns to include dependencies in the group (based on dependency name)
          # A dependency is handled by the first group that matches it, so group order matters.
          - "nx" # Group the "nx" dependency
          - "@nx/jest"  # Group the "@nx/jest" dependency
          - "@nx/js"    # Group the "@nx/js" dependency
      # Other groups are not documented ;)
      react:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          # exclude react-redux as it drops the support for react 17
      deckgl:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "@deck.gl/*"
      # helper packages for storybook that are not following the same versioning as storybook itself
      storybook-helpers:
        applies-to: version-updates
        patterns:
          - "@storybook/addon-webpack5-compiler-babel"
          - "@storybook/test-runner"
      # remaining storybook packages that are following the same versioning as storybook itself
      storybook:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "storybook"
          - "@storybook/*"
      typescript-eslint:
        applies-to: version-updates
        patterns:
          - "@typescript-eslint/*"
      eslint-plugin:
        applies-to: version-updates
        patterns:
          - "eslint-plugin-*"
      testing-library:
        applies-to: version-updates
        patterns:
          - "@testing-library/*"
